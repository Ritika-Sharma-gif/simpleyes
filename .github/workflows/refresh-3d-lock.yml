name: Generate 3D dependency lockfile
on:
  push:
    branches: [feat/3d-living-editorial-experience]
    paths: [package.json]
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-living-editorial-experience
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save lockfile to feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "simplyes-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize 3D dependency lockfile"
            git push origin HEAD:feat/3d-living-editorial-experience
          fi
